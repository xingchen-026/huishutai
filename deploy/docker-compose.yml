# deploy/docker-compose.yml
services:
  db:
    image: postgres:16
    container_name: huishutai-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huishutai}
      POSTGRES_USER: ${POSTGRES_USER:-huishutai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 仅在开发时映射到宿主机127.0.0.1，方便用GUI工具连接
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: huishutai-backend
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-huishutai}
      - POSTGRES_USER=${POSTGRES_USER:-huishutai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy # 等数据库健康后再启动
    # 注意：首次启动先跑 migrate，可以覆盖 command
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: huishutai-frontend
    restart: always
    ports:
      - "80:80" # 映射宿主机 80 端口
    depends_on:
      - backend

volumes:
  postgres_data: