# deploy/docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: huishutai-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huishutai}
      POSTGRES_USER: ${POSTGRES_USER:-huishutai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 仅在开发时映射到宿主机127.0.0.1，方便用GUI工具连接
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: