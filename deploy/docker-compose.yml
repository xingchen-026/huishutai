# deploy/docker-compose.yml
services:
  # ======= Postgres =======
  db:
    image: postgres:16
    container_name: huishutai-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huishutai}
      POSTGRES_USER: ${POSTGRES_USER:-huishutai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 仅在开发时映射到宿主机127.0.0.1，方便用GUI工具连接
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ==================== Milvus 依赖：etcd ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: huishutai-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== Milvus 依赖：MinIO ====================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: huishutai-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== Milvus standalone ====================
  milvus:
    image: milvusdb/milvus:v2.6.0
    container_name: huishutai-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker          # Milvus 2.6 内置 WAL；若启动报错可去掉这行
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"    # SDK 连接端口（仅本机可连，便于调试）
      - "127.0.0.1:9091:9091"      # 健康检查 / 自带 WebUI
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # 可选：Milvus 图形化控制台（开发调试用，生产可删）
  attu:
    image: zilliz/attu:latest
    container_name: huishutai-attu
    restart: always
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      milvus:
        condition: service_healthy
  
    # ==================== 业务文件对象存储（独立 MinIO，与 Milvus 的 minio 隔离） ====================
  minio-files:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: huishutai-minio-files
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huishutai_files}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe_Strong_123}
    volumes:
      - minio_files_data:/data
    command: minio server /data --console-address ":9001"
    ports:
      # 9004 给浏览器访问签名 URL，9005 是管理控制台
      - "127.0.0.1:${MINIO_FILES_API_PORT:-9004}:9000"
      - "127.0.0.1:${MINIO_FILES_CONSOLE_PORT:-9005}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  
    # ======== 后端 =========
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: huishutai-backend
    restart: always
    environment:
        POSTGRES_DB: ${POSTGRES_DB:-huishutai}
        POSTGRES_USER: ${POSTGRES_USER:-huishutai}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_HOST: db
        MILVUS_URI: http://milvus:19530
        DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
        # ===== 文件对象存储（内部地址给后端，public 地址给签名 URL） =====
        MINIO_ENDPOINT: minio-files:9000
        MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9004}
        MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-huishutai_files}
        MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ChangeMe_Strong_123}
        MINIO_SECURE: "false"
        MINIO_PUBLIC_SECURE: "false"
        MINIO_BUCKET: ${MINIO_BUCKET:-huishutai-files}
        MINIO_PRESIGN_EXPIRY: ${MINIO_PRESIGN_EXPIRY:-3600}
        MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
        LLMAPI_ENCRYPTION_KEY: ${LLMAPI_ENCRYPTION_KEY:-}
        LLMAPI_HTTP_TIMEOUT: ${LLMAPI_HTTP_TIMEOUT:-30}
        LLMAPI_ALLOW_PRIVATE_BASE_URL: ${LLMAPI_ALLOW_PRIVATE_BASE_URL:-true}
    depends_on:
      db:
        condition: service_healthy
      minio-files:
        condition: service_healthy
    # 首次启动先跑 migrate，再检查/初始化 bucket
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_storage &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  # ======== 前端 =========
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: huishutai-frontend
    restart: always
    ports:
      - "80:80" # 映射宿主机 80 端口
    depends_on:
      - backend

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  minio_files_data:
  milvus_data: